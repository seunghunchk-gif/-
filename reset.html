<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#8f1d1d"><title>교동짬뽕 연결코드 재설정</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f6efe5;font-family:"Malgun Gothic",sans-serif;color:#2c2521}.box{max-width:430px;margin:60px auto;padding:24px}.card{background:#fffdf9;border:1px solid #eadfce;border-radius:20px;padding:24px;box-shadow:0 10px 30px #53341918}h1{font-size:24px;color:#8f1d1d;margin:0 0 8px}p{line-height:1.6;color:#6f6259}input{width:100%;padding:15px;border:1px solid #d8c9b8;border-radius:12px;font-size:17px}button{width:100%;margin-top:12px;border:0;border-radius:12px;padding:15px;background:#8f1d1d;color:white;font-size:16px;font-weight:800}.msg{margin-top:12px;font-weight:700}</style></head>
<body><div class="box"><div class="card"><h1>교동짬뽕 연결코드 재설정</h1><p>기존 연결코드를 지우고 새 연결코드를 저장합니다.</p>
<input id="code" autocomplete="off" placeholder="매장 연결코드 입력">
<button onclick="save()">연결코드 저장</button><div id="msg" class="msg"></div></div></div>
<script>
const K="gyodong_store_key", U="https://avqkiuiggmgnlkknjrit.supabase.co/functions/v1/gyodong-sync";
localStorage.removeItem(K);
async function save(){let k=document.getElementById("code").value.trim(),m=document.getElementById("msg");if(!k){m.textContent="연결코드를 입력하세요.";return}m.textContent="확인 중...";
try{let r=await fetch(U+"?date=2099-12-31",{headers:{"x-store-key":k}});if(!r.ok)throw Error();localStorage.setItem(K,k);m.textContent="연결 완료. 교동짬뽕 화면으로 이동합니다.";setTimeout(()=>location.href="./?fresh="+Date.now(),800)}
catch(e){m.textContent="연결코드가 맞지 않습니다. 다시 확인하세요."}}
</script></body></html>
